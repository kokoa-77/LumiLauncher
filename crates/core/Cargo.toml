[package]
name = "launcher-core"
description = "启动器核心库：不依赖 Tauri，可单独测试，也供命令行调试工具使用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 应用壳开启它，让核心类型可以导出成 TypeScript
specta = ["dep:specta"]

[dependencies]
base64 = { workspace = true }
encoding_rs = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
regex = { workspace = true }
keyring-core = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, optional = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "macros", "rt", "process", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-native-keyring-store = { workspace = true }
trash = { workspace = true }
win-screenshot = { workspace = true }
winreg = { workspace = true }
xcap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "macros", "rt", "rt-multi-thread", "net"] }

[lints]
workspace = true
