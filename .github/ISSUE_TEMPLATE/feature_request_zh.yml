name: 功能建议（中文）
description: 已经想清楚的具体改进。还在构思的想法请先发到 Discussions 讨论。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Lumi 的取舍准则是：**它让进游戏更快，还是更慢？** 让进游戏更慢的功能会往后放。
        还没想清楚细节、想先听听大家意见的，请发到 [Discussions → Ideas](https://github.com/kokoa-77/LumiLauncher/discussions/categories/ideas)。

        以下内容不在 Lumi 的范围内，提交后会直接关闭：离线登录或绕过正版验证、第三方认证服务器或认证注入器、非官方披风、绕过 CurseForge 作者的下载限制、遥测或广告。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有的 Issue 和 Discussions，没有找到相同的建议
          required: true
        - label: 我用的是最新版本，Lumi 目前确实没有这个功能
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你在什么场景下遇到了什么麻烦？
      placeholder: 例如：每次换整合包都要重新调一遍按键……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 希望怎么解决
      description: 你希望 Lumi 怎么做？可以附上示意图或其他软件的截图。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么绕过的
      description: 现在你用什么办法解决？别的启动器是怎么做的？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
