name: Lumi Windows Release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign updater installer with CI keys and generate latest.json
        type: boolean
        default: false
      publish:
        description: Create a draft GitHub Release (requires sign=true)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer & Portable
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Validate release inputs
        env:
          SIGN_RELEASE: ${{ inputs.sign }}
          CREATE_DRAFT: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:CREATE_DRAFT -eq 'true' -and $env:SIGN_RELEASE -ne 'true') {
            throw 'Creating a release draft requires updater signing to be enabled.'
          }
          if ($env:SIGN_RELEASE -eq 'true' -and ($env:GITHUB_REPOSITORY -ne 'kokoa-77/LumiLauncher' -or $env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH")) {
            throw 'Signed releases must be triggered from the default branch of kokoa-77/LumiLauncher.'
          }
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'lumi-build')" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: Show pinned Rust toolchain
        run: rustup show

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full check suite
        run: pnpm check

      - name: Verify generated bindings and lockfiles are clean
        run: git diff --exit-code -- app/src/lib/bindings.ts Cargo.lock pnpm-lock.yaml

      - name: Verify Cargo, UI, and Tauri versions match
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $rustVersion = ($metadata.packages | Where-Object name -eq 'launcher-app').version
          $uiVersion = (Get-Content -LiteralPath app/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (!$rustVersion -or $rustVersion -cne $uiVersion -or $rustVersion -cne $tauriVersion) {
            throw 'Cargo, UI, and Tauri versions must match.'
          }

      - name: Build unsigned pre-review installer
        if: ${{ !inputs.sign }}
        env:
          LUMI_MICROSOFT_CLIENT_ID: ${{ vars.LUMI_MICROSOFT_CLIENT_ID }}
        run: pnpm --dir app tauri build --ci --bundles nsis --target x86_64-pc-windows-msvc -- --locked

      - name: Build binary with updater public key
        if: ${{ inputs.sign }}
        env:
          LUMI_UPDATER_PUBKEY: ${{ vars.LUMI_UPDATER_PUBKEY }}
          LUMI_MICROSOFT_CLIENT_ID: ${{ vars.LUMI_MICROSOFT_CLIENT_ID }}
        run: |
          $env:LUMI_UPDATER_PUBKEY = ([string] $env:LUMI_UPDATER_PUBKEY).Trim()
          $config = Join-Path $env:RUNNER_TEMP 'lumi-release.conf.json'
          ./scripts/release/New-TauriReleaseConfig.ps1 -OutputPath $config
          pnpm --dir app tauri build --ci --no-bundle --config $config --target x86_64-pc-windows-msvc -- --locked

      - name: Bundle and sign NSIS updater installer
        if: ${{ inputs.sign }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY.'
          }
          $config = Join-Path $env:RUNNER_TEMP 'lumi-release.conf.json'
          pnpm --dir app tauri bundle --ci --bundles nsis --config $config --target x86_64-pc-windows-msvc

      - name: Assemble release artifacts and SHA256SUMS
        env:
          SIGN_RELEASE: ${{ inputs.sign }}
          LUMI_UPDATER_PUBKEY: ${{ vars.LUMI_UPDATER_PUBKEY }}
        run: |
          $target = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc'
          $output = Join-Path $env:RUNNER_TEMP 'lumi-release'
          ./scripts/release/New-WindowsRelease.ps1 -TargetDirectory $target -OutputDirectory $output -Unsigned:($env:SIGN_RELEASE -ne 'true')

      - uses: actions/upload-artifact@v7
        with:
          name: lumi-windows-x64
          path: ${{ runner.temp }}/lumi-release/
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create Draft GitHub Release
    if: ${{ inputs.publish && inputs.sign }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lumi-windows-x64
          path: lumi-windows-x64

      - name: Create maintainer-only draft release
        working-directory: lumi-windows-x64
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --strict --check SHA256SUMS.txt
          version="$(jq -er '.version' latest.json)"
          installer="Lumi_${version}_x64-setup.exe"
          portable="Lumi_${version}_x64-portable.zip"
          gh release create "v${version}" "$installer" "$installer.sig" "$portable" latest.json SHA256SUMS.txt \
            --target "$GITHUB_SHA" --draft --title "Lumi v${version}" \
            --notes $'Lumi Windows release candidate draft. Verify SHA256SUMS.txt and live official account regression before publishing.\n\nLumi is an independent third-party launcher and is NOT an official Minecraft product, nor approved by or associated with Mojang Studios or Microsoft.'
